<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#090D12"/>
    </linearGradient>
    <linearGradient id="blueGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79C0FF"/>
      <stop offset="100%" stop-color="#388BFD"/>
    </linearGradient>
    <linearGradient id="alphaGrad512" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388BFD"/>
      <stop offset="50%" stop-color="#BC8CFF"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 外圆角矩形背景 (深空极客暗色) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad512)" stroke="#30363D" stroke-width="8"/>

  <!-- 背景轻量量化点阵 -->
  <circle cx="160" cy="160" r="6" fill="#30363D" opacity="0.6"/>
  <circle cx="256" cy="160" r="6" fill="#30363D" opacity="0.6"/>
  <circle cx="352" cy="160" r="6" fill="#30363D" opacity="0.6"/>
  <circle cx="160" cy="256" r="6" fill="#30363D" opacity="0.6"/>
  <circle cx="352" cy="256" r="6" fill="#30363D" opacity="0.6"/>
  <circle cx="160" cy="352" r="6" fill="#30363D" opacity="0.6"/>
  <circle cx="256" cy="352" r="6" fill="#30363D" opacity="0.6"/>

  <!-- 量化核心 "Q" 环体 -->
  <circle cx="256" cy="248" r="140" fill="none" stroke="url(#blueGrad512)" stroke-width="26" opacity="0.95"/>

  <!-- Alpha 上行量化脉冲折线 -->
  <path d="M 144 304 L 216 224 L 280 272 L 376 144" 
        fill="none" 
        stroke="url(#alphaGrad512)" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow512)"/>

  <!-- 折线关键数据锚点 -->
  <circle cx="216" cy="224" r="14" fill="#58A6FF"/>
  <circle cx="280" cy="272" r="14" fill="#BC8CFF"/>
  <circle cx="376" cy="144" r="18" fill="#3FB950" filter="url(#glow512)"/>

  <!-- "Q" 的斜出尾巴 (动量箭头) -->
  <path d="M 320 320 L 392 392" 
        fill="none" 
        stroke="url(#blueGrad512)" 
        stroke-width="28" 
        stroke-linecap="round"/>
</svg>
