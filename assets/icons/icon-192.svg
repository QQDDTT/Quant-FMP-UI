<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#090D12"/>
    </linearGradient>
    <linearGradient id="blueGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79C0FF"/>
      <stop offset="100%" stop-color="#388BFD"/>
    </linearGradient>
    <linearGradient id="alphaGrad192" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388BFD"/>
      <stop offset="50%" stop-color="#BC8CFF"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
    <filter id="glow192" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 外圆角矩形背景 (深空极客暗色) -->
  <rect x="6" y="6" width="180" height="180" rx="42" fill="url(#bgGrad192)" stroke="#30363D" stroke-width="3"/>

  <!-- 背景轻量量化点阵 -->
  <circle cx="60" cy="60" r="2" fill="#30363D" opacity="0.6"/>
  <circle cx="96" cy="60" r="2" fill="#30363D" opacity="0.6"/>
  <circle cx="132" cy="60" r="2" fill="#30363D" opacity="0.6"/>
  <circle cx="60" cy="96" r="2" fill="#30363D" opacity="0.6"/>
  <circle cx="132" cy="96" r="2" fill="#30363D" opacity="0.6"/>
  <circle cx="60" cy="132" r="2" fill="#30363D" opacity="0.6"/>
  <circle cx="96" cy="132" r="2" fill="#30363D" opacity="0.6"/>

  <!-- 量化核心 "Q" 环体 -->
  <circle cx="96" cy="93" r="52" fill="none" stroke="url(#blueGrad192)" stroke-width="10" opacity="0.95"/>

  <!-- Alpha 上行量化脉冲折线 -->
  <path d="M 54 114 L 81 84 L 105 102 L 141 54" 
        fill="none" 
        stroke="url(#alphaGrad192)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow192)"/>

  <!-- 折线关键数据锚点 -->
  <circle cx="81" cy="84" r="5" fill="#58A6FF"/>
  <circle cx="105" cy="102" r="5" fill="#BC8CFF"/>
  <circle cx="141" cy="54" r="7" fill="#3FB950" filter="url(#glow192)"/>

  <!-- "Q" 的斜出尾巴 (动量箭头) -->
  <path d="M 120 120 L 147 147" 
        fill="none" 
        stroke="url(#blueGrad192)" 
        stroke-width="11" 
        stroke-linecap="round"/>
</svg>
