<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D14"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#131A24"/>
    </linearGradient>
    <linearGradient id="alphaCurve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388BFD"/>
      <stop offset="55%" stop-color="#BC8CFF"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
    <linearGradient id="alphaArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3FB950" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#388BFD" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262D" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #F0F6FC; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; }
    .pulse-node { animation: pulseNode 2.4s infinite ease-in-out; }
    .draw-line { stroke-dasharray: 900; stroke-dashoffset: 900; animation: drawCurve 4.5s ease-out forwards infinite; }
    .radar-spin { transform-origin: 995px 225px; animation: radarSweep 6s linear infinite; }
    .candle-up { fill: #3FB950; stroke: #3FB950; }
    .candle-dn { fill: #F85149; stroke: #F85149; }
    @keyframes pulseNode {
      0%, 100% { r: 5px; opacity: 1; }
      50% { r: 8px; opacity: 0.65; }
    }
    @keyframes drawCurve {
      0% { stroke-dashoffset: 900; }
      65%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes radarSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Background & Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#30363D" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="380" rx="12" fill="url(#grid)" opacity="0.65"/>

  <!-- Top Header Bar -->
  <rect x="32" y="28" width="1136" height="54" rx="10" fill="#161B22" stroke="#30363D"/>
  <circle cx="58" cy="55" r="6" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="74" y="60" class="title" font-size="18">QUANT-FMP · US EQUITIES TIERED PYRAMID &amp; ALPHA ENGINE</text>
  <rect x="650" y="40" width="155" height="30" rx="6" fill="#1F2937" stroke="#388BFD"/>
  <text x="664" y="59" class="mono" font-size="12" fill="#79C0FF">259,441+ EOD BARS</text>
  <rect x="818" y="40" width="160" height="30" rx="6" fill="#1F2937" stroke="#BC8CFF"/>
  <text x="832" y="59" class="mono" font-size="12" fill="#D2A8FF">86 CAUSAL FACTORS</text>
