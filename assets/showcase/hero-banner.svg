  <rect x="32" y="96" width="760" height="292" rx="12" fill="#0D1117" fill-opacity="0.88" stroke="#30363D"/>
  <text x="52" y="126" class="title" font-size="14" fill="#8B949E">TIER-1 SPY REGIME &amp; TIER-2 CROSS-SECTIONAL ALPHA MOMENTUM (PURGED WALK-FORWARD CV)</text>
  <text x="615" y="126" class="mono" font-size="12" fill="#3FB950">● REGIME: BALANCED (55% EXP)</text>

