    <text x="16" y="82" class="sub">• 存续 + 退市标的 (防幸存者偏差)</text>
    <text x="16" y="102" class="sub">• 259,441+ 日K &amp; 除权息复权</text>
    <text x="16" y="122" class="sub">• 财务三大表披露日因果对齐</text>
    <rect x="16" y="138" width="212" height="24" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="26" y="154" class="mono" fill="#58A6FF">5-Dim Quality Gate: 99.9%</text>
  </g>

