    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8B949E; font-size: 11.5px; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; }
    .flow-dash { stroke-dasharray: 8 6; animation: dashMove 1.6s linear infinite; }
    @keyframes dashMove {
      to { stroke-dashoffset: -28; }
    }
  </style>

  <rect width="1200" height="280" rx="14" fill="url(#wfBg)" stroke="#30363D" stroke-width="2"/>
  <text x="36" y="38" class="title" font-size="15">QUANT-FMP END-TO-END CAUSAL PIPELINE (ZERO LOOK-AHEAD BIAS &amp; PAPER SANDBOX ISOLATION)</text>
  <text x="955" y="38" class="mono" fill="#3FB950">● 4-STAGE VERIFIED PIPELINE</text>

  <!-- Connecting Animated Pipes -->
  <line x1="280" y1="145" x2="335" y2="145" stroke="url(#pipeGrad)" stroke-width="3" class="flow-dash"/>
  <line x1="575" y1="145" x2="630" y2="145" stroke="url(#pipeGrad)" stroke-width="3" class="flow-dash"/>
  <line x1="870" y1="145" x2="925" y2="145" stroke="url(#pipeGrad)" stroke-width="3" class="flow-dash"/>

