    <text x="16" y="58" class="title" font-size="15">$2,000 沙盘 7 道硬风控</text>
    <text x="16" y="82" class="sub">• 实盘 API 致命硬阻断 (PK* Only)</text>
    <text x="16" y="102" class="sub">• 单票 $200 碎股 + 30% 现金缓冲</text>
    <text x="16" y="122" class="sub">• +2.0% 锁盈 / -1.5% 防御熔断</text>
    <rect x="16" y="138" width="212" height="24" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="26" y="154" class="mono" fill="#3FB950">Alpaca Paper Sub-Ledger</text>
