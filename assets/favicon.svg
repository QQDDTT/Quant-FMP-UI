<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 背景流光渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#090D12"/>
    </linearGradient>

    <!-- Q环与科技蓝高亮渐变 -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79C0FF"/>
      <stop offset="100%" stop-color="#388BFD"/>
    </linearGradient>

    <!-- 趋势折线与光点渐变 (蓝到紫到绿) -->
    <linearGradient id="alphaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388BFD"/>
      <stop offset="50%" stop-color="#BC8CFF"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>

    <!-- 柔和发光投影 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 外圆角矩形背景 (深空极客暗色) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#30363D" stroke-width="1.5"/>

  <!-- 背景轻量网格/量化坐标点阵 -->
  <circle cx="20" cy="20" r="0.8" fill="#30363D" opacity="0.6"/>
  <circle cx="32" cy="20" r="0.8" fill="#30363D" opacity="0.6"/>
  <circle cx="44" cy="20" r="0.8" fill="#30363D" opacity="0.6"/>
  <circle cx="20" cy="32" r="0.8" fill="#30363D" opacity="0.6"/>
  <circle cx="44" cy="32" r="0.8" fill="#30363D" opacity="0.6"/>
  <circle cx="20" cy="44" r="0.8" fill="#30363D" opacity="0.6"/>
  <circle cx="32" cy="44" r="0.8" fill="#30363D" opacity="0.6"/>

  <!-- 量化核心 "Q" 环体 (圆环结构) -->
  <circle cx="32" cy="31" r="18" fill="none" stroke="url(#blueGrad)" stroke-width="3.5" opacity="0.95"/>

  <!-- Alpha 上行量化脉冲折线 (穿透 Q 环，代表超额与预测) -->
  <path d="M 18 38 L 27 28 L 35 34 L 47 18" 
        fill="none" 
        stroke="url(#alphaGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- 折线关键数据锚点 -->
  <circle cx="27" cy="28" r="2" fill="#58A6FF"/>
  <circle cx="35" cy="34" r="2" fill="#BC8CFF"/>
  <circle cx="47" cy="18" r="2.5" fill="#3FB950" filter="url(#glow)"/>

  <!-- "Q" 的斜出尾巴 (构成完整 Q 字符，同时具象化为动量箭头) -->
  <path d="M 40 40 L 49 49" 
        fill="none" 
        stroke="url(#blueGrad)" 
        stroke-width="4" 
        stroke-linecap="round"/>
</svg>
